<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#f3e9d2; --parchment-2:#ece0c4; --ink:#2b241c;
    --colonial-red:#7b2d26; --shutter:#2f4a33; --amber:#c97b3d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Source Serif 4',Georgia,serif;color:var(--ink);background:#1d1712}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #masthead{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;
    pointer-events:none;opacity:0;animation:fadein 1.4s .3s ease forwards;text-align:left}
  #masthead h1{font-family:'IM Fell English SC',serif;font-weight:400;letter-spacing:.02em;
    font-size:clamp(22px,4.6vw,40px);color:var(--parchment);
    text-shadow:0 1px 0 rgba(43,36,28,.9),0 2px 14px rgba(20,12,6,.55);line-height:1.05}
  #masthead .rule{width:min(280px,52vw);height:1px;background:linear-gradient(90deg,var(--parchment),transparent);
    margin:7px 0 6px;opacity:.7}
  #masthead p{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(13px,2.6vw,17px);
    color:#f6ecd6;text-shadow:0 1px 10px rgba(20,12,6,.6)}

  #bar{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:min(640px,94vw);
    opacity:0;animation:fadein 1.2s .9s ease forwards;z-index:5}
  #bar button{font-family:'Source Serif 4',Georgia,serif;font-size:13.5px;font-weight:600;
    color:var(--ink);background:rgba(243,233,210,.93);border:1px solid rgba(123,45,38,.55);
    border-radius:999px;padding:8px 13px;cursor:pointer;backdrop-filter:blur(4px);
    box-shadow:0 2px 10px rgba(20,12,6,.35);transition:transform .12s ease,background .12s ease}
  #bar button:hover{background:var(--parchment);transform:translateY(-1px)}
  #bar button:focus-visible{outline:2px solid var(--parchment);outline-offset:2px}
  #bar button.tone{background:rgba(47,74,51,.9);color:var(--parchment);border-color:rgba(243,233,210,.4)}

  #card{position:fixed;right:16px;top:50%;transform:translateY(-50%) translateX(14px);
    width:min(330px,86vw);background:var(--parchment);color:var(--ink);
    border:1px solid rgba(43,36,28,.5);border-radius:10px;
    box-shadow:0 12px 40px rgba(15,10,5,.5), inset 0 0 0 4px rgba(243,233,210,1), inset 0 0 0 5px rgba(123,45,38,.35);
    padding:18px 18px 16px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:6}
  #card.open{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
  #card .eyebrow{font-family:'IM Fell English',serif;font-style:italic;font-size:12.5px;color:var(--colonial-red);margin-bottom:2px}
  #card h2{font-family:'IM Fell English SC',serif;font-weight:400;font-size:22px;line-height:1.1;margin-bottom:8px}
  #card p{font-size:14.5px;line-height:1.5}
  #card .close{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;line-height:1;
    color:var(--colonial-red);cursor:pointer;font-family:Georgia,serif;padding:4px}
  @media (max-width:640px){
    #card{right:12px;left:12px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);
      width:auto;transform:translateY(10px)}
    #card.open{transform:translateY(0)}
  }

  #hint{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 15px);
    font-family:'IM Fell English',serif;font-style:italic;font-size:12.5px;color:rgba(246,236,214,.85);
    text-shadow:0 1px 8px rgba(20,12,6,.6);pointer-events:none;opacity:0;animation:fadein 1.2s 1.6s ease forwards}
  @media (max-width:760px){#hint{display:none}}

  #err{display:none;position:fixed;inset:auto 12px 12px 12px;background:#3a1512;color:#f6ecd6;
    padding:10px 12px;border-radius:8px;font-size:13px;z-index:50}
  #veil{position:fixed;inset:0;background:#1d1712;z-index:40;transition:opacity 1s ease;pointer-events:none}
  @keyframes fadein{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #masthead,#bar,#hint{animation-duration:.01s;animation-delay:0s}
    #card{transition:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="veil"></div>

<header id="masthead">

<div id="err"></div>
<noscript><p style="color:#f3e9d2;padding:20px">This page needs JavaScript for the 3D tour.</p></noscript>

<script type="module">
let THREE;
try{
  THREE=await import('./three.module.min.js');
}catch(e1){
  try{
    THREE=await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js');
  }catch(e2){
    THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js');
  }
}

class TinyOrbit{
  constructor(cam,dom){
    this.cam=cam; this.dom=dom;
    this.target=new THREE.Vector3();
    this.sph=new THREE.Spherical(40,1.1,0.7);
    this.dTheta=0; this.dPhi=0;
    this.radiusGoal=40;
    this.minDistance=6; this.maxDistance=110;
    this.minPolar=0.12; this.maxPolar=1.52;
    this.autoRotate=false; this.autoRotateSpeed=0.09;
    this.pointers=new Map(); this.pinch=0;
    dom.style.touchAction='none';
    dom.addEventListener('pointerdown',e=>{
      if(dom.setPointerCapture) dom.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId,[e.clientX,e.clientY]);
      if(this.pointers.size===2){
        const p=[...this.pointers.values()];
        this.pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
      }
    });
    dom.addEventListener('pointermove',e=>{
      if(!this.pointers.has(e.pointerId)) return;
      const prev=this.pointers.get(e.pointerId);
      this.pointers.set(e.pointerId,[e.clientX,e.clientY]);
      if(this.pointers.size===1){
        const h=this.dom.clientHeight||600;
        this.dTheta-=2.2*Math.PI*(e.clientX-prev[0])/h*0.35;
        this.dPhi-=2.2*Math.PI*(e.clientY-prev[1])/h*0.35;
      }else if(this.pointers.size===2){
        const p=[...this.pointers.values()];
        const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])||1;
        if(this.pinch>0){
          this.radiusGoal=THREE.MathUtils.clamp(this.radiusGoal*this.pinch/d,this.minDistance,this.maxDistance);
        }
        this.pinch=d;
      }
    });
    const up=e=>{this.pointers.delete(e.pointerId);this.pinch=0;};
    dom.addEventListener('pointerup',up);
    dom.addEventListener('pointercancel',up);
    dom.addEventListener('wheel',e=>{
      e.preventDefault();
      this.radiusGoal=THREE.MathUtils.clamp(this.radiusGoal*Math.pow(1.001,e.deltaY),this.minDistance,this.maxDistance);
    },{passive:false});
  }
  sync(){
    const v=new THREE.Vector3().subVectors(this.cam.position,this.target);
    this.sph.setFromVector3(v);
    this.radiusGoal=this.sph.radius; this.dTheta=0; this.dPhi=0;
  }
  update(dt){
    if(this.autoRotate&&this.pointers.size===0) this.dTheta-=this.autoRotateSpeed*dt;
    const k=0.16;
    this.sph.theta+=this.dTheta*k; this.sph.phi+=this.dPhi*k;
    this.dTheta*=(1-k); this.dPhi*=(1-k);
    this.sph.phi=THREE.MathUtils.clamp(this.sph.phi,this.minPolar,this.maxPolar);
    this.sph.radius+=(this.radiusGoal-this.sph.radius)*0.18;
    this.sph.radius=THREE.MathUtils.clamp(this.sph.radius,this.minDistance,this.maxDistance);
    const off=new THREE.Vector3().setFromSpherical(this.sph);
    this.cam.position.copy(this.target).add(off);
    this.cam.lookAt(this.target);
  }
}

window.addEventListener('error', (e)=>{
  const d=document.getElementById('err'); d.style.display='block';
  d.textContent='Something misfired: '+(e.message||'unknown error');
});

/* ---------------- renderer / scene / camera ---------------- */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(46,window.innerWidth/window.innerHeight,0.1,1500);
camera.position.set(27,12,31);

const controls=new TinyOrbit(camera,renderer.domElement);
controls.target.set(-1,2.6,-2);
controls.autoRotate=true;
controls.sync();

/* ---------------- texture helpers ---------------- */
function tex(w,h,draw,repX=1,repY=1){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  if(repX!==1||repY!==1){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repX,repY);}
  return t;
}
function speckle(g,w,h,base,dots,n){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){
    g.fillStyle=dots[(Math.random()*dots.length)|0];
    const r=Math.random()*1.8+0.5;
    g.beginPath(); g.arc(Math.random()*w,Math.random()*h,r,0,6.283); g.fill();
  }
}
const grassTex=tex(256,256,(g,w,h)=>speckle(g,w,h,'#4e7a3a',['#446e33','#578544','#5f8c49','#3f6a2f'],2600),14,12);
const fairwayTex=tex(512,512,(g,w,h)=>{
  for(let i=0;i<8;i++){g.fillStyle=i%2?'#4d7c3b':'#5a8a47';g.fillRect(0,i*64,w,64);}
  g.globalAlpha=.25;
  for(let i=0;i<1500;i++){g.fillStyle=Math.random()>.5?'#446e33':'#639250';
    g.fillRect(Math.random()*w,Math.random()*h,2,2);}
},2,3);
const drivewayTex=tex(256,256,(g,w,h)=>speckle(g,w,h,'#cdb894',['#a08a63','#e6d9bd','#8f7a55','#bfa87e'],3200),6,10);
const gravelTex=tex(256,256,(g,w,h)=>speckle(g,w,h,'#c9bda2',['#a89a7c','#ded2b6','#93876b'],3000),3,3);
const asphaltTex=tex(256,256,(g,w,h)=>speckle(g,w,h,'#585a5e',['#4c4e52','#65676b','#525458'],2200),10,1);
const sidingTex=tex(256,256,(g,w,h)=>{
  g.fillStyle='#f4f4ef'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(105,105,100,.22)'; g.lineWidth=2;
  for(let y=14;y<h;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  g.globalAlpha=.04;
  for(let i=0;i<400;i++){g.fillStyle='#8a8a80';g.fillRect(Math.random()*w,Math.random()*h,2,2);}
},2,1);
const shingleTex=tex(256,256,(g,w,h)=>{
  g.fillStyle='#3c4046'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(14,16,20,.55)'; g.lineWidth=2;
  for(let y=0;y<h;y+=22){
    g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();
    g.strokeStyle='rgba(14,16,20,.3)';
    const off=(y/22)%2?14:0;
    for(let x=off;x<w;x+=28){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+22);g.stroke();}
    g.strokeStyle='rgba(14,16,20,.55)';
  }
  g.globalAlpha=.08;
  for(let i=0;i<300;i++){g.fillStyle=Math.random()>.5?'#565c66':'#2b2e34';
    g.fillRect(Math.random()*w,Math.random()*h,3,3);}
},4,2);
const brickTex=tex(128,128,(g,w,h)=>{
  g.fillStyle='#8a3b2e'; g.fillRect(0,0,w,h);
  g.strokeStyle='#c9b8a2'; g.lineWidth=2;
  for(let y=0;y<h;y+=16){
    g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();
    const off=(y/16)%2?16:0;
    for(let x=off;x<w;x+=32){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+16);g.stroke();}
  }
},3,1);
const paneTex=tex(96,128,(g,w,h)=>{
  g.fillStyle='#212d36'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(246,238,220,.85)'; g.lineWidth=3;
  for(let x=w/3;x<w;x+=w/3){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
  for(let y=h/4;y<h;y+=h/4){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  g.strokeRect(1,1,w-2,h-2);
});
const garageDoorTex=tex(160,128,(g,w,h)=>{
  g.fillStyle='#33413a'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(15,20,17,.7)'; g.lineWidth=3;
  for(let x=8;x<w;x+=18){g.beginPath();g.moveTo(x,6);g.lineTo(x,h-6);g.stroke();}
  g.strokeStyle='rgba(220,225,215,.18)'; g.strokeRect(4,4,w-8,h-8);
});
const doorTex=tex(96,160,(g,w,h)=>{
  g.fillStyle='#27392c'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(10,16,12,.8)'; g.lineWidth=3;
  const p=(x,y,pw,ph)=>{g.strokeRect(x,y,pw,ph);};
  p(12,12,w-24,40); p(12,62,w-24,40); p(12,112,w-24,36);
});
const signTex=tex(512,340,(g,w,h)=>{
  g.fillStyle='#f0e5cb'; g.fillRect(0,0,w,h);
  g.strokeStyle='#3a2d20'; g.lineWidth=14; g.strokeRect(10,10,w-20,h-20);
  g.strokeStyle='#7b2d26'; g.lineWidth=3; g.strokeRect(26,26,w-52,h-52);
  g.fillStyle='#2f2417'; g.textAlign='center';
  g.font='64px Georgia'; g.fillText('\u2654',w/2,108);
  g.font='italic 700 62px Georgia'; g.fillText("King's Arms",w/2,192);
  g.font='28px Georgia'; g.letterSpacing='10px';
  g.fillText('T A V E R N',w/2,248);
  g.font='italic 22px Georgia'; g.letterSpacing='0px';
  g.fillText('est. whenever you arrive',w/2,296);
});
function skyGrad(stops){
  return tex(4,512,(g)=>{
    const gr=g.createLinearGradient(0,0,0,512);
    stops.forEach(s=>gr.addColorStop(s[0],s[1]));
    g.fillStyle=gr; g.fillRect(0,0,4,512);
  });
}
const skySunset=skyGrad([[0,'#8fb0cf'],[0.42,'#cfd7db'],[0.55,'#f2c58f'],[0.63,'#f79a63'],[0.68,'#ef7550'],[0.74,'#d8837c'],[1,'#6a7387']]);
const skyDay=skyGrad([[0,'#79aede'],[0.5,'#a9cdea'],[0.72,'#d6e8f2'],[1,'#e8f1ef']]);
const waterSunset=tex(4,512,(g)=>{
  const gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#f3b183'); gr.addColorStop(0.35,'#dd9280');
  gr.addColorStop(0.7,'#9b93a0'); gr.addColorStop(1,'#7d8ba0');
  g.fillStyle=gr; g.fillRect(0,0,4,512);
});
const waterDay=tex(4,512,(g)=>{
  const gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#a9c8de'); gr.addColorStop(0.5,'#7fa4bd'); gr.addColorStop(1,'#6a93ad');
  g.fillStyle=gr; g.fillRect(0,0,4,512);
});

/* ---------------- materials ---------------- */
const matGrass=new THREE.MeshStandardMaterial({map:grassTex,roughness:1});
const matFairway=new THREE.MeshStandardMaterial({map:fairwayTex,roughness:1});
const matDrive=new THREE.MeshStandardMaterial({map:drivewayTex,roughness:1});
const matGravel=new THREE.MeshStandardMaterial({map:gravelTex,roughness:1});
const matAsphalt=new THREE.MeshStandardMaterial({map:asphaltTex,roughness:1});
const matSiding=new THREE.MeshStandardMaterial({map:sidingTex,roughness:.92});
const matTrim=new THREE.MeshStandardMaterial({color:0xf7f6f0,roughness:.85});
const matRoof=new THREE.MeshStandardMaterial({map:shingleTex,roughness:.95});
const matBrick=new THREE.MeshStandardMaterial({map:brickTex,roughness:.95});
const matShutter=new THREE.MeshStandardMaterial({color:0x1d2a20,roughness:.85});
const matIron=new THREE.MeshStandardMaterial({color:0x17181a,roughness:.6,metalness:.5});
const matDoor=new THREE.MeshStandardMaterial({map:doorTex,roughness:.8});
const matChrome=new THREE.MeshStandardMaterial({color:0xd9dade,metalness:.95,roughness:.18});
const matTire=new THREE.MeshStandardMaterial({color:0x141414,roughness:.95});
const matBlackSoft=new THREE.MeshStandardMaterial({color:0x1c1c1e,roughness:.8});
const matGuardsRed=new THREE.MeshPhysicalMaterial({color:0xd82918,roughness:.26,metalness:.06,clearcoat:1,clearcoatRoughness:.12});
const matMGARed=new THREE.MeshPhysicalMaterial({color:0xd41f24,roughness:.24,metalness:.05,clearcoat:1,clearcoatRoughness:.1});
const matCognac=new THREE.MeshStandardMaterial({color:0x8a5a33,roughness:.75});
const matBlackLeather=new THREE.MeshStandardMaterial({color:0x232323,roughness:.7});
const matTrunk=new THREE.MeshStandardMaterial({color:0x5c4a36,roughness:1});
const glassMats=[];
function makeGlassMat(){
  const m=new THREE.MeshStandardMaterial({map:paneTex,roughness:.35,metalness:.1,
    emissive:0xffb36b,emissiveIntensity:0.5,emissiveMap:paneTex});
  glassMats.push(m); return m;
}
const matCarGlass=new THREE.MeshStandardMaterial({color:0x9fb4bd,roughness:.08,metalness:.2,transparent:true,opacity:.45});

/* ---------------- lights ---------------- */
const hemi=new THREE.HemisphereLight(0xffd9b0,0x3a4a34,0.55); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffb070,1.5);
sun.position.set(34,26,28); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45;
sun.shadow.camera.near=1; sun.shadow.camera.far=160;
sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);
const rim=new THREE.DirectionalLight(0xff8a56,0.7);
rim.position.set(4,14,-90); scene.add(rim);
const amb=new THREE.AmbientLight(0xffffff,0.12); scene.add(amb);

/* ---------------- sky, sun, water ---------------- */
const skyMat=new THREE.MeshBasicMaterial({map:skySunset,side:THREE.BackSide,fog:false});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(640,24,18),skyMat));

const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(8,40),
  new THREE.MeshBasicMaterial({color:0xff6a35,fog:false}));
sunDisc.position.set(6,4.5,-338); scene.add(sunDisc);
const glowTex=tex(128,128,(g)=>{
  const gr=g.createRadialGradient(64,64,4,64,64,64);
  gr.addColorStop(0,'rgba(255,170,90,.9)'); gr.addColorStop(.4,'rgba(255,140,80,.35)');
  gr.addColorStop(1,'rgba(255,140,80,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
});
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,fog:false,depthWrite:false,
  blending:THREE.AdditiveBlending,opacity:.9}));
glow.scale.set(85,85,1); glow.position.copy(sunDisc.position); scene.add(glow);

const waterMat=new THREE.MeshStandardMaterial({map:waterSunset,roughness:.22,metalness:.15});
const water=new THREE.Mesh(new THREE.PlaneGeometry(560,250),waterMat);
water.rotation.x=-Math.PI/2; water.position.set(0,-0.05,-222); scene.add(water);
const glint=new THREE.Mesh(new THREE.PlaneGeometry(9,210),

// cart path ribbon
function ribbon(pts,w,mat,y){
  const L=[],R=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[Math.min(i+1,pts.length-1)],o=pts[Math.max(i-1,0)];
    let dx=q[0]-o[0],dz=q[1]-o[1];const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
    const nx=-dz,nz=dx;
    L.push([p[0]+nx*w/2,p[1]+nz*w/2]); R.push([p[0]-nx*w/2,p[1]-nz*w/2]);
  }
  const s=new THREE.Shape();
  s.moveTo(L[0][0],-L[0][1]);
  L.forEach(p=>s.lineTo(p[0],-p[1]));
  R.reverse().forEach(p=>s.lineTo(p[0],-p[1]));
  const g=new THREE.ShapeGeometry(s); g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,mat); m.position.y=y; m.receiveShadow=true; scene.add(m); return m;
}

function gableRoof(parent,len,halfSpan,rise,cx,topY,cz){

// gambrel roof: steep lower slope (holds the dormers) breaking to a shallower cap
function gambrelRoof(parent,len,halfSpan,rise,cx,topY,cz,breakX=0.40,breakY=0.74){
  const s=new THREE.Shape();
  s.moveTo(-halfSpan,0);
  s.lineTo(-halfSpan*breakX,rise*breakY);
  s.lineTo(0,rise);
  s.lineTo(halfSpan*breakX,rise*breakY);
  s.lineTo(halfSpan,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:len,bevelEnabled:false});
  g.rotateY(Math.PI/2);
  g.translate(cx-len/2,topY,cz);
  const m=new THREE.Mesh(g,[matSiding,matRoof]);
  m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}

});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>7) return;
  ptr.x=(e.clientX/window.innerWidth)*2-1;
  ptr.y=-(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){
    let o=h.object;
    while(o){ if(o.userData&&o.userData.hot){openCard(o.userData.hot);return;} o=o.parent; }
  }
  card.classList.remove('open');
});

/* ---------------- camera tours ---------------- */
const VIEWS={
  house:{p:[13,5.5,19],t:[-4,3.0,-2]},
  cars:{p:[8.5,3,17.5],t:[8,0.8,10]},
  yard:{p:[-22,4.5,17],t:[-15,1,9]},
  club:{p:[16,7,-48],t:[28,1,-70]},
  sunset:{p:[-1,4.5,-16],t:[2,4,-140]}
};
let anim=null;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function flyTo(v){
  anim={t:0,fp:camera.position.clone(),ft:controls.target.clone(),
    tp:new THREE.Vector3(...v.p),tt:new THREE.Vector3(...v.t)};
  controls.autoRotate=false; card.classList.remove('open');
}
document.querySelectorAll('#bar button[data-view]').forEach(b=>{
  b.addEventListener('click',()=>{ flyTo(VIEWS[b.dataset.view]);
    if(b.dataset.view==='club') openCard('club');
    if(b.dataset.view==='yard') openCard('yard');
  });
});
document.getElementById('aboutBtn').addEventListener('click',()=>{
  cardE.textContent='\u201cgalavanting\u201d \ud83e\udd28 \u2014 for the record';
  cardT.textContent='The standing offer';
  cardB.textContent='This Williamsburg home sits empty 90% of the time. A replica of the King\u2019s Arms Tavern: 3 king suites, a family room, and a bedroom & bath over the garage. Big back yard. Two classic cars to enjoy \u2014 a \u201961 MGA and an \u201988 Porsche 911 Carrera. The country club is gorgeous, activities galore. Great halfway spot between Boston & Austin. Bring the family, friends, etc. Anytime you want.';
  card.classList.add('open');
});

/* ---------------- day / sunset modes ---------------- */
let mode='sunset';
const modeBtn=document.getElementById('modeBtn');
function setMode(m){
  mode=m;
  const isDay=m==='day';
  skyMat.map=isDay?skyDay:skySunset; skyMat.needsUpdate=true;
  waterMat.map=isDay?waterDay:waterSunset; waterMat.needsUpdate=true;
  sunDisc.visible=!isDay; glow.visible=!isDay; glint.visible=!isDay;
  scene.fog.color.set(isDay?0xd7e5ec:0xeeb48f);
  hemi.color.set(isDay?0xbfd9ff:0xffd9b0);
  hemi.groundColor.set(isDay?0x486b3a:0x3a4a34);
  hemi.intensity=isDay?0.75:0.55;
  sun.color.set(isDay?0xfff4e0:0xffb070);
  sun.intensity=isDay?1.35:1.5;
  sun.position.set(isDay?38:34,isDay?52:26,isDay?18:28);
  rim.intensity=isDay?0.15:0.7;
  glassMats.forEach(g=>{g.emissiveIntensity=isDay?0.02:0.5;});
  uplights.forEach(u=>{u.intensity=isDay?0:60;});
  lampLights.forEach(u=>{u.intensity=isDay?0:7;});
  lanternLight.intensity=isDay?0.5:6;
  renderer.toneMappingExposure=isDay?1.0:1.02;
  modeBtn.textContent=isDay?'Sunset':'Daylight';
}
modeBtn.addEventListener('click',()=>setMode(mode==='day'?'sunset':'day'));
setMode('sunset');

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  if(anim){
    anim.t+=dt/1.5;
    const k=ease(Math.min(1,anim.t));
    camera.position.lerpVectors(anim.fp,anim.tp,k);
    controls.target.lerpVectors(anim.ft,anim.tt,k);
    camera.lookAt(controls.target);
    controls.sync();
    if(anim.t>=1) anim=null;
  }else{
    controls.update(dt);
  }
  flag.rotation.y=Math.sin(t*2.2)*0.22;
  glint.material.opacity=0.24+Math.sin(t*1.3)*0.05;
  renderer.render(scene,camera);
}
loop();
setTimeout(()=>{document.getElementById('veil').style.opacity='0';},250);

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
